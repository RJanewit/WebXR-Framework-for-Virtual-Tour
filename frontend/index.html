      content="black-translucent"
    />

      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"

    <style>
      body,
      html {
        margin: 0;
        height: 100dvh;
        width: 100vw;
        position: fixed;
        overflow: hidden;
        background-color: #000;
        font-family: "Kanit", sans-serif;
      }

      canvas {
        width: 100% !important;
        height: 100dvh !important;
        display: block;
      }

      #canvas-container {
        width: 100%;
        height: 100dvh;
      }

      header span,
      header button,
      header div {
        font-family: "Kanit", sans-serif !important;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
        transition: opacity 0.5s;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .close-btn {
        position: absolute !important;
        top: 15px !important;
        right: 25px !important;
        color: white !important;
        font-size: 55px !important;
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 9999 !important;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        line-height: 1 !important;
        opacity: 0.8;
      }
      .close-btn:hover {
        color: #20cdfa !important;
        transform: scale(1.1);
        opacity: 1;
      }

      #nav-bar {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 15px;
        border-radius: 50px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: opacity 0.5s;
      }
      .nav-dot {
        width: 12px;
        height: 12px;
        background-color: #ffffff;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.4s;
        position: relative;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
      }
      @media (min-width: 768px) {
        #nav-bar {
          bottom: 25px;
          padding: 15px 30px;
          gap: 20px;
        }
        .nav-dot {
          width: 16px;
          height: 16px;
        }
      }
      .nav-dot:hover {
        transform: scale(1.3);
      }
      .nav-dot::after {
        content: attr(data-label);
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s;
        font-family: sans-serif;
      }
      .nav-dot:hover::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .nav-dot.visited {
        background-color: #eb6725;
        box-shadow: 0 0 10px #eb6725;
        transform: scale(1.1);
      }
      .nav-dot.current {
        background-color: #eb6725;
        box-shadow: 0 0 10px #eb6725;
        border: 2px solid white;
        transform: scale(1.4);
      }
      .hidden-nav {
        opacity: 0;
        pointer-events: none;
      }

      #model-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 3000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #model-viewer-container {
        width: 80%;
        height: 80%;
        background: #1a1a1a;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }
      #model-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .model-close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 0, 0, 0.7);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 10;
      }

      .map-dot {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: absolute;
        width: 25px;
        height: 25px;
        background: #fff;
        border: 3px solid white;
        border-radius: 50%;
        cursor: pointer;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        z-index: 10;
      }
      .map-dot:hover {
        background: #eb6725 !important;
        transform: translate(-50%, -50%) scale(1.4) !important;
        box-shadow: 0 0 20px #eb6725 !important;
      }
      .map-dot::after {
        content: attr(title);
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 10px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .map-dot:hover::after {
        opacity: 1;
      }
      .map-dot.current-location {
        background: #eb6725 !important;
        border-color: #fff !important;
        transform: translate(-50%, -50%) scale(1.6) !important;
        box-shadow: 0 0 15px #fff !important;
        animation: pulse-pin 1.5s infinite;
        z-index: 20;
      }

      @keyframes pulse-pin {
        0% {
          box-shadow: 0 0 0 0 rgba(32, 205, 250, 0.7);
        }
        70% {
          box-shadow: 0 0 0 15px rgba(32, 205, 250, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(32, 205, 250, 0);
        }
      }
      body > #VRButton {
        display: none !important;
      }

      #vr-btn-container #VRButton {
        position: relative !important;
        bottom: auto !important;
        left: auto !important;
        transform: none !important;
        margin: 0 !important;
        padding: 4px 14px !important;
        border-radius: 50px !important;
        font-family: "Kanit", sans-serif !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        letter-spacing: 1px !important;

        background: rgba(32, 205, 250, 0.15) !important;
        border: 1px solid rgba(32, 205, 250, 0.5) !important;
        color: #fff !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
        box-shadow: 0 0 15px rgba(32, 205, 250, 0.3) !important;
      }

      #vr-btn-container #VRButton:hover {
        background: rgba(32, 205, 250, 0.3) !important;
        box-shadow: 0 0 25px rgba(32, 205, 250, 0.6) !important;
        transform: scale(1.05) !important;
      }

      @media (min-width: 768px) {
        #vr-btn-container #VRButton {
          padding: 6px 16px !important;
          font-size: 14px !important;
        }
      }
    </style>

    <script>
      // ==========================================
      // 🥽 ระบบจัดการปุ่ม VR (อัปเกรดป้องกัน iPhone โหมด Desktop)
      // ==========================================
      document.addEventListener("DOMContentLoaded", () => {
        const vrContainer = document.getElementById("vr-btn-container");

        // 🌟 1. เช็คว่าเป็น iOS หรือไม่ (ดักจับ iPhone/iPad ที่หลอกว่าเป็น Mac ด้วย TouchPoints)
        const isIOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const isMobileDevice =
          /Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent,
          ) || isIOS;

        const vrBtnManager = setInterval(() => {
          const vrBtn = document.getElementById("VRButton");

          if (vrBtn) {
            // 🌟 2. เพิ่มการเช็คขนาดหน้าจอ (innerWidth) ช่วยเสริมอีกชั้น
            if (
              isMobileDevice ||
              vrBtn.textContent.includes("NOT") ||
              window.innerWidth <= 768
            ) {
              vrBtn.remove();
              vrContainer.style.display = "none"; // ปิดกล่องทิ้งไปเลย
              console.log(
                "📱 Mobile/Unsupported VR detected: Removed VR Button",
              );
              clearInterval(vrBtnManager);
              return;
            }

            if (vrBtn.textContent === "ENTER VR") {
              vrBtn.textContent = "VR MODE";
            }

            vrContainer.classList.remove("hidden");
            vrContainer.style.display = "flex";
            vrContainer.appendChild(vrBtn);

            clearInterval(vrBtnManager);
          }
        }, 500);
      });
    </script>

    <script>
      function parseJwt(token) {
        try {
          const base64Url = token.split(".")[1];
          const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
          const jsonPayload = decodeURIComponent(
            window
              .atob(base64)
              .split("")
              .map(function (c) {
                return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
              })
              .join(""),
          );
          return JSON.parse(jsonPayload);
        } catch (error) {
          return null;
        }
      }

      const token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "/login.html";
      } else {
        const decodedToken = parseJwt(token);

        if (!decodedToken || decodedToken.role !== "admin") {
          window.location.href = "/login.html";
        }
      }
    </script>

      .custom-scrollbar::-webkit-scrollbar {

      /* Animation สำหรับตอนโผล่ปุ่ม Cancel */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .nav-active {

      .nav-active i {

      .map-dot {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: absolute;
        width: 25px;
        height: 25px;
        background: #ff3333;
        border: 3px solid white;
        border-radius: 50%;
        cursor: pointer;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        z-index: 10;
      }
      .map-dot:hover {
        background: #20cdfa !important;
        transform: translate(-50%, -50%) scale(1.4) !important;
        box-shadow: 0 0 20px #20cdfa !important;
      }
      .map-dot::after {
        content: attr(title);
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 10px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .map-dot:hover::after {
        opacity: 1;
      }
      .map-dot.current-location {
        background: #20cdfa !important;
        border-color: #fff !important;
        transform: translate(-50%, -50%) scale(1.6) !important;
        box-shadow: 0 0 15px #20cdfa !important;
        animation: pulse-pin 1.5s infinite;
        z-index: 20;
      }
    </style>

    <div
      id="add-scene-modal"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center transition-opacity"
    >
      <div
        class="bg-secondary w-[400px] rounded-2xl shadow-2xl overflow-hidden border border-white/20 transform transition-transform"
      >
        <div
          class="px-6 py-4 border-b border-white/10 flex justify-between items-center text-white"
        >
          <h3 class="text-xl font-bold">Add New Scene</h3>
          <button
            id="btn-close-scene-modal"
            class="hover:text-red-400 transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <div class="p-6 space-y-4">
          <div>
            <label class="block text-white text-sm font-semibold mb-1"
              >Scene Name</label
            >
            <input
              type="text"
              id="scene-name-input"
              placeholder="e.g., office_01"
              class="w-full h-10 px-3 bg-theme-bg text-gray-800 rounded outline-none focus:ring-2 focus:ring-primary"
            />
          </div>
          <div>
            <label class="block text-white text-sm font-semibold mb-1"
              >Zone</label
            >
            <select
              id="scene-zone-input"
              class="w-full h-10 px-3 bg-theme-bg text-gray-800 rounded outline-none focus:ring-2 focus:ring-primary cursor-pointer"
            ></select>
          </div>
          <div>
            <label class="block text-white text-sm font-semibold mb-1"
              >Upload Panorama Image</label
            >
            <input
              type="file"
              id="scene-image-file"
              accept="image/*"
              class="w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-blue-600 cursor-pointer"
            />
          </div>
        </div>

        <div class="px-6 py-4 bg-black/20 flex gap-3">
          <button
            id="btn-submit-scene"
            class="flex-1 bg-saved text-white font-bold py-2.5 rounded-lg hover:bg-green-600 transition-colors cursor-pointer"
          >
            Save Scene
          </button>
        </div>
      </div>
    </div>

    <div
      id="edit-scene-modal"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center transition-opacity"
    >
      <div
        class="bg-secondary w-[400px] rounded-2xl shadow-2xl overflow-hidden border border-white/20"
      >
        <div
          class="px-6 py-4 border-b border-white/10 flex justify-between items-center text-white"
        >
          <h3 class="text-xl font-bold">Edit Scene</h3>
          <button
            onclick="
              document
                .getElementById('edit-scene-modal')
                .classList.add('hidden')
            "
            class="hover:text-red-400 transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <div class="p-6 space-y-4">
          <input type="hidden" id="edit-scene-old-name" />

          <div>
            <label class="block text-white text-sm font-semibold mb-1"
              >Scene Name</label
            >
            <input
              type="text"
              id="edit-scene-name"
              class="w-full h-10 px-3 bg-theme-bg text-gray-800 rounded outline-none focus:ring-2 focus:ring-primary"
            />
          </div>
          <div>
            <label class="block text-white text-sm font-semibold mb-1"
              >Zone</label
            >
            <select
              id="edit-scene-zone"
              class="w-full h-10 px-3 bg-theme-bg text-gray-800 rounded outline-none focus:ring-2 focus:ring-primary cursor-pointer"
            ></select>
          </div>
        </div>

        <div class="px-6 py-4 bg-black/20 flex gap-3">
          <button
            id="btn-delete-edit-scene"
            class="bg-red-500 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-red-600 transition-colors cursor-pointer"
            title="Delete Scene"
          >
            <i class="fa-solid fa-trash-can"></i>
          </button>

          <button
            id="btn-submit-edit-scene"
            class="flex-1 bg-blue-500 text-white font-bold py-2.5 rounded-lg hover:bg-blue-600 transition-colors cursor-pointer"
          >
            Update Scene
          </button>
        </div>
      </div>
    </div>

    <div
      id="image-modal"
      class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center transition-all duration-300 opacity-0"
    >
      <button
        id="btn-close-image"
        class="absolute top-6 right-8 text-white hover:text-red-500 text-4xl cursor-pointer transition-colors z-[210]"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img
        id="modal-image-content"
        src=""
        class="max-w-[90%] max-h-[90vh] object-contain rounded-lg shadow-2xl scale-95 transition-transform duration-300"
      />
    </div>

    <div
      id="video-modal"
      class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center transition-all duration-300 opacity-0"
    >
      <button
        id="btn-close-video"
        class="absolute top-6 right-8 text-white hover:text-red-500 text-4xl cursor-pointer transition-colors z-[210]"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
      <video
        id="modal-video-content"
        controls
        autoplay
        class="max-w-[90%] max-h-[90vh] rounded-lg shadow-2xl scale-95 transition-transform duration-300 bg-black"
      ></video>
    </div>

    <div
      id="model-modal"
      class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center transition-all duration-300 opacity-0"
    >
      <button
        id="btn-close-model"
        class="absolute top-6 right-8 text-white hover:text-red-500 text-4xl cursor-pointer transition-colors z-[210]"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div
        id="modal-model-container"
        class="w-[90%] max-w-5xl h-[80vh] bg-gradient-to-b from-gray-800 to-black rounded-2xl shadow-2xl relative overflow-hidden scale-95 transition-transform duration-300"
      >
        <model-viewer
          id="modal-model-content"
          src=""
          auto-rotate
          camera-controls
          shadow-intensity="1"
          class="w-full h-full outline-none"
        >
        </model-viewer>
      </div>
    </div>

    <div
      id="media-upload-modal"
      class="hidden fixed inset-0 bg-black/60 z-[300] flex items-center justify-center backdrop-blur-sm"
    >
      <div
        class="bg-secondary p-6 rounded-lg shadow-2xl w-[600px] flex flex-col gap-4 border-2 border-white/20"
      >
        <div
          id="media-preview-box"
          class="w-full h-[350px] bg-theme-bg flex items-center justify-center relative overflow-hidden rounded-md border border-gray-400"
        >
          <span id="media-preview-text" class="font-bold text-xl text-black"
            >Please Upload Media</span
          >

          <img
            id="media-preview-img"
            class="hidden w-full h-full object-contain"
          />
          <video
            id="media-preview-video"
            class="hidden w-full h-full object-contain bg-black"
            controls
          ></video>
          <model-viewer
            id="media-preview-model"
            class="hidden w-full h-full"
            auto-rotate
            camera-controls
          ></model-viewer>
        </div>

        <div class="flex justify-between items-center mt-2">
          <input type="file" id="modal-file-input" class="hidden" />
          <button
            id="btn-modal-upload"
            class="bg-primary text-white px-6 py-2.5 font-bold rounded hover:bg-blue-800 transition shadow-md"
          >
            Upload Media
          </button>
          <div class="flex gap-2">
            <button
              id="btn-modal-save"
              class="bg-saved text-white px-8 py-2.5 font-bold rounded hover:bg-green-600 transition shadow-md"
            >
              Save
            </button>
            <button
              id="btn-modal-cancel"
              class="bg-danger text-white px-8 py-2.5 font-bold rounded hover:bg-red-600 transition shadow-md"
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
